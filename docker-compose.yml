services:
  khinsider-subsonic:
    image: ghcr.io/nmt3325/khinsider-subsonic-relay:latest
    ports:
      - "8080:8080"
    environment:
      SUBSONIC_USER: admin
      SUBSONIC_PASSWORD: change-me
      # 永続化先（Dockerfile の既定値と同じだが、明示しておく）
      LIBRARY_PATH: /data/library.json
      PLAYLISTS_PATH: /data/playlists.json
      USER_STATS_PATH: /data/user_data.sqlite
      CACHE_DIR: /data/cache
      SONGS_DB: /data/songs.sqlite
      # index の自動更新。起動時だけでなく、稼働中も定期的に再チェックする（0 で無効）
      LIBRARY_REFRESH_HOURS: "24"
      SONGS_REFRESH_HOURS: "24"
      # 独自SONGS_URLを使う場合は対応するmanifestだけを明示指定する
      # SONGS_MANIFEST_URL: "https://your-host.example/songs-index.json"
      # SONGS_MANIFEST_URL: ""  # manifestを使わずgzipの内容検証にする
      PROXY_STREAM: "1"   # 同一URLで音声・Range/HEADを返す（0で従来の302）
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
      # SONG_SEARCH: "off"  # 曲名検索を無効化（曲 DB を作らない = 約 600MB 節約）
    volumes:
      - khinsider-data:/data
      # ホスト側の見えるディレクトリに置きたい場合は上の行を消してこちらを使う:
      # - ./data:/data
    restart: unless-stopped
    depends_on:
      flaresolverr:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8080') + '/', timeout=10)
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  flaresolverr:
    # FlareSolverr 3.5.2, pinned multi-architecture image (includes ARM64).
    image: ghcr.io/flaresolverr/flaresolverr@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    restart: unless-stopped
    shm_size: 512mb
    mem_limit: 2g
    cpus: 2
    environment:
      LOG_LEVEL: warn
      LOG_HTML: "false"
    # No published port: only the relay's Docker network can use the browser.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  # library.json（約 24MB）、曲インデックス DB（約 600MB）、アルバムページの
  # HTML キャッシュが入る。曲インデックスの更新中は新旧 2 世代が一時的に
  # 並ぶので、1.5GB ほど余裕を見ておくと安全。
  khinsider-data:
